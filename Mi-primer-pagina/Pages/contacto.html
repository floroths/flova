<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactá a FLOVA Studio para conversar sobre tu proyecto.">
    <title>Contacto | FLOVA Studio</title>
</head>
<body>
    <header>
        <a href="../index.html" aria-label="FLOVA Studio - Inicio">
            <img src="../images/logo.png" alt="Logo de FLOVA Studio" width="100">
        </a>

        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>

                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>


<main>
        <section>
            <h1>Hablemos de tu proyecto</h1>
            <p>
                ¿Tenés una idea en mente? Escribinos para contarnos
                qué necesitás y cómo podemos ayudarte.
            </p>

    
        </section>

        <section>
            <h2>Dejanos tu mensaje</h2>

            <form action="#" method="post">
                <p>
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="message">Mensaje:</label>
                    <textarea id="message" name="message" required></textarea>
                </p>

                <button type="submit">Enviar mensaje</button>
            </form>
        </section>

      
    </main>


    <footer> 
        <a href="https://www.instagram.com/flova.studio/" target="_blank">Instagram</a>
